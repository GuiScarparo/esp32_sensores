; Projeto PlatformIO - ESP32 + DHT11 + SW-420 + BME280/BMP280
; Documentação: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Monitor Serial (mesma velocidade do Serial.begin do código)
monitor_speed = 115200

; Upload mais rápido (se der erro de upload, apague esta linha)
upload_speed = 921600

; Bibliotecas: o PlatformIO baixa sozinho na primeira compilação
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BMP280 Library@^2.6.8

; Menos mensagens de debug do núcleo do ESP32
build_flags =
    -DCORE_DEBUG_LEVEL=0
